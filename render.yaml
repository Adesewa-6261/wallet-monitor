services:
  - type: web
    name: wallet-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BITNOB_CLIENT_ID
        sync: false
      - key: BITNOB_CLIENT_SECRET
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BOT_SHARED_SECRET
        generateValue: true
      - key: TRONGRID_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
